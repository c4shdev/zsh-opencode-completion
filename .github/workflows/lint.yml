name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: shellcheck + zsh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: shellcheck
        run: shellcheck init.zsh zsh-opencode.plugin.zsh

      - name: zsh syntax check
        run: |
          zsh -n init.zsh
          zsh -n zsh-opencode.plugin.zsh
